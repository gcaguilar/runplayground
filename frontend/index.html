<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b0a" />
    <meta
      name="description"
      content="Run — panel personal de entrenamiento. Tus datos de Garmin, en tu servidor."
    />
    <script>
      // Apply the stored theme before the first paint to avoid a dark flash.
      (() => {
        try {
          const stored = localStorage.getItem("run.theme");
          const light = window.matchMedia("(prefers-color-scheme: light)").matches;
          const theme =
            stored === "light" || stored === "dark" ? stored : light ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#f4f7f0" : "#080b0a");
        } catch {
          // The React provider applies the theme once the app boots.
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Run — Panel de entrenamiento</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
